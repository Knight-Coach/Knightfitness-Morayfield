name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest is 26.04. Playwright 1.56.1 cannot install Chromium
    # dependencies on that image, so the suite never starts. 24.04 is the
    # newest runner this Playwright version supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
